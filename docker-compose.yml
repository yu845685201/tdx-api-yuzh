services:
  stock-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tdx-stock-web
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - /Users/yuzh/develop/os/os_yuzh/04_工具/stock_yuzh_base/tdx-api/web/data/database:/app/data/database
    environment:
      - TZ=Asia/Shanghai
      - TDX_SKIP_BJ_CODES=1
      # 限流方案 20261120 §3 P0：同花顺回源共享节拍（毫秒，0=不限速）
      - THS_MIN_INTERVAL_MS=500
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.stock.description=TDX Stock Data Query System"
      - "com.stock.version=1.0.0"

networks:
  stock-network:
    driver: bridge
